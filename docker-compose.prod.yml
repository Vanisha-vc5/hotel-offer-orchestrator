# Production override for a single Linux VM:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build --wait
#
# - Caddy is the only service publishing public ports (80/443, automatic HTTPS).
# - Every other service has its published ports removed (`!reset`); the Temporal
#   UI is bound to 127.0.0.1 only and reached through an SSH tunnel.
# - ADMIN_TOKEN and PUBLIC_DOMAIN are required (compose fails before starting).
# - Log rotation and memory limits on every service.

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  caddy:
    image: caddy:2.11.9
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required (your domain or <ip>.sslip.io)}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [hotel-net]
    healthcheck:
      test: ['CMD', 'wget', '-q', '--spider', 'http://127.0.0.1:2019/config/']
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging
    mem_limit: 128m

  api:
    ports: !reset []
    environment:
      REQUIRE_ADMIN_TOKEN: 'true'
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required in production}
      TRUST_PROXY: 'true'
    logging: *logging
    mem_limit: 512m

  worker:
    environment:
      REQUIRE_ADMIN_TOKEN: 'true'
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required in production}
    logging: *logging
    mem_limit: 768m

  redis:
    ports: !reset []
    logging: *logging
    mem_limit: 256m

  temporal:
    ports: !reset []
    logging: *logging
    mem_limit: 1g

  temporal-ui:
    # Not public: loopback only. Use `ssh -L 8080:127.0.0.1:8080 user@vm`.
    ports: !override
      - '127.0.0.1:8080:8080'
    logging: *logging
    mem_limit: 256m

  postgresql:
    logging: *logging
    mem_limit: 512m

volumes:
  caddy-data:
  caddy-config:
