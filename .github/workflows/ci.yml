name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4.12
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - name: Unit tests
        run: npm run test:unit
      - name: Workflow tests (Temporal test server + dev server)
        run: npm run test:workflow
      - name: Integration tests (supertest + real Redis)
        run: npm run test:integration

  docker-e2e:
    name: Docker build + Postman (newman)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: hotel-offer-orchestrator:1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start stack
        run: |
          cp .env.example .env
          docker compose up -d --wait --wait-timeout 240
          docker compose ps
      - name: Coalescing demo
        run: npm run demo:coalescing
      - name: Postman collection
        run: npm run test:postman
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 300
      - name: Stop stack
        if: always()
        run: docker compose down -v
